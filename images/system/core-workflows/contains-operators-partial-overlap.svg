<svg width="560" height="320" viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Venn diagram: condition values A, B, C partially overlap field values C, D. Only C sits in both circles.</title>
  <circle cx="215" cy="180" r="120" fill="#fde9c8" fill-opacity="0.8" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="345" cy="180" r="120" fill="#dbeafe" fill-opacity="0.8" stroke="#1d5fb0" stroke-width="2.5"/>
  <text x="157" y="46" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">Condition values</text>
  <text x="403" y="46" font-family="sans-serif" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="normal">Field values</text>
  <text x="150" y="188" font-family="sans-serif" font-size="24" fill="#1f2937" text-anchor="middle" font-weight="bold">A, B</text>
  <text x="280" y="188" font-family="sans-serif" font-size="24" fill="#1f2937" text-anchor="middle" font-weight="bold">C</text>
  <text x="410" y="188" font-family="sans-serif" font-size="24" fill="#1f2937" text-anchor="middle" font-weight="bold">D</text>
</svg>
